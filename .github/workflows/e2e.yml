name: E2E Tests

# Disabled in CI until the e2e suite is rewritten for the anonymous-only
# (no-auth) flow. The current specs and global-setup still seed
# user-scoped scans and dashboards from the removed auth layer.
# Trigger manually via the Actions tab while the rewrite is pending.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beacon
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: beacon_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U beacon" --health-interval 5s --health-timeout 5s --health-retries 5

      redis:
        image: bitnami/redis:latest
        env:
          REDIS_PASSWORD: testredis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli -a testredis ping" --health-interval 5s --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://beacon:testpw@localhost:5432/beacon_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: testredis
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      WORKER_PORT: 3001
      IP_HASH_SALT: ci-salt
      SCAN_ACCESS_SECRET: e2e-test-scan-access-secret-0123456789abcdef
      REPORT_STORAGE_PATH: /tmp/reports
      E2E_STUB_SCAN: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Export Chromium path for worker
        run: |
          CHROMIUM=$(node -e "const {chromium}=require('@playwright/test');console.log(chromium.executablePath())")
          echo "CHROMIUM_PATH=$CHROMIUM" >> $GITHUB_ENV

      - name: Create .env.test from CI env
        run: env | grep -E '^(DATABASE_URL|REDIS_|NEXT_PUBLIC_|E2E_|REPORT_|CHROMIUM_PATH|NODE_ENV|WORKER_PORT|IP_HASH_SALT|SCAN_ACCESS_SECRET)' > .env.test

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
